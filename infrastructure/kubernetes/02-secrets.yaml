apiVersion: v1
kind: Secret
metadata:
  name: fraud-platform-secrets
  namespace: fraud-detection
type: Opaque
stringData:
  POSTGRES_USER: "fraud_user"
  POSTGRES_PASSWORD: "fraud_prod_secure_password"
  POSTGRES_DB: "fraud_detection"
  DATABASE_URL: "postgresql://fraud_user:fraud_prod_secure_password@postgres-service:5432/fraud_detection"
